	<link rel="stylesheet" type="text/css" href="./style.css">
	<title>Document</title>
</head>
<body>
	<section id="start_screen">start</section>
	<section id="playing_screen">
		<div id="boardANDpreview">
			<div id="game_board">

			</div>
			<div id="preview">
				<canvas id="next_preview" width="80" height="80"></canvas>
				<canvas id="sub_next_preview" width="40" height="40"></canvas>
			</div>
		</div>
	</section>
	<section id="paused_screen">
		<span class="paused">
			PAUSED
		</span>
		<div class="paused_screen"></div>
	</section>
	<section id="gameover_screen">gameover</section>
	<script src="./state.js"></script>
	<script src="./renderer.js"></script>
	<script src="./board.js"></script>
	<script src="./piece.js"></script>
