<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="./style.css">
	<title>Document</title>
</head>
<body>
	<section id="start_screen">
		<div>
			<span class="subject">
				START
			</span>
			<div class="explain">
				<p>
					이동: 방향키 </br>
					회전: Z, X </br>
					하드드롭: 스페이스바 </br>
					일시정지: ESC
				</p>
				<input type="text" id="nickname_input" placeholder="닉네임을 입력하세요">
				<button id="nickname_button">&crarr;</button>
				<h4 id="starting_msg"></h4>
			</div>
		</div>
	</section>
	<section id="playing_screen">
		<div id="boardANDpreview">
			<div id="level_score">
				<div id="level_display">
					<span>LEVEL</span>
					<output id="level">0</output>
				</div>
				<div id="score_display">
					<span>SCORE</span>
					<output id="score">0</output>
				</div>
			</div>
			<div id="game_board">
				<canvas id="board_canvas" width="200" height="400"></canvas>
			</div>
			<div id="preview">
				<canvas id="next_preview" width="80" height="80"></canvas>
				<canvas id="sub_next_preview" width="40" height="40"></canvas>
			</div>
		</div>
	</section>
	<section id="paused_screen">
		<span class="subject">
			PAUSED
		</span>
		<div class="paused_screen"></div>
	</section>
	<section id="gameover_screen">
		<span class="subject">
			gameover
		</span>
		<div id="ranking_card">
			<div id="ranking_title">HIGH SCORES</div>
			<div id="ranking_header">
				<span>RANK</span>
				<span>NAME</span>
				<span>SCORE</span>
			</div>
			<div id="ranking_list"></div>
			<button id="ranking_toggle" class="hidden">···</button>
		</div>
		<div id="my_record" class="hidden">
			<div id="ending_level_display">
				<span>LEVEL</span>
				<output id="ending_level">0</output>
			</div>
			<div id="finalscore_display">
				<span>SCORE</span>
				<output id="final_score">0</output>
			</div>
		</div>
		<div id="restart" class="hidden">
			press SPACE BAR to restart
		</div>
	</section>
	<script src="./ranking.js"></script>
	<script src="./state.js"></script>
	<script src="./renderer.js"></script>
	<script src="./board.js"></script>
	<script src="./piece.js"></script>
	<script src="./main.js"></script>
</body>
</html>
